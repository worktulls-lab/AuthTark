  captcha-prompt: "<yellow>Прежде чем зарегистрироваться, решите пример: <white>%question% = ?</white></yellow>\n<gray>Ответ: <white>/captcha <число></white></gray>"
  captcha-required: "<yellow>Сначала решите пример: <white>%question% = ?</white> → <gray>/captcha <число></gray></yellow>"
