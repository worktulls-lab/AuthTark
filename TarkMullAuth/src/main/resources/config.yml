# ============================================================
#  TarkMullAuth — конфигурация
#  Все тексты используют формат MiniMessage:
#  https://docs.advntr.dev/minimessage/format.html
#  (<gradient:#hex:#hex>, <bold>, <yellow> и т.д.)
# ============================================================

storage-file: "players.yml"

# Минимальная длина пароля
min-password-length: 4

# --------------------------------------------------------------
# Сессии — это и есть механизм "иногда пароль не нужен".
# Если игрок уже входил с этого же IP и сессия ещё не истекла,
# при следующем заходе он авторизуется автоматически, без /login.
# --------------------------------------------------------------
session:
  enabled: true
  duration-minutes: 15
  require-same-ip: true

login:
  # сколько секунд даётся игроку на /login или /register до кика
  timeout-seconds: 60
  # сколько неверных попыток пароля допускается до кика
  max-attempts: 5

# --------------------------------------------------------------
# Математическая капча против ботов-регистраторов.
# Новому игроку сначала нужно решить пример (/captcha <число>),
# и только потом становится доступен /register.
# На вход уже зарегистрированных (/login) не влияет.
# --------------------------------------------------------------
captcha:
  enabled: true
  min-number: 1
  max-number: 20
  # сколько неверных ответов допускается до кика
  max-attempts: 5

# --------------------------------------------------------------
# Надпись-водяной знак на экране входа/регистрации, гаснет сама.
# ВАЖНО: у ванильного Minecraft нет настоящего верхнего левого угла,
# управляемого плагином — используется боковая панель (scoreboard),
# она рисуется в верхнем ПРАВОМ углу экрана.
# Если на сервере уже есть другой плагин со своим scoreboard —
# отключите (enabled: false), чтобы не было конфликта.
# --------------------------------------------------------------
branding:
  enabled: true
  text: "by TarkMull"
  duration-seconds: 4

messages:
  already-authenticated: "<gray>Вы уже вошли в аккаунт.</gray>"
  already-registered: "<yellow>Вы уже зарегистрированы. Используйте <white>/login <пароль></white>.</yellow>"
